<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- soft glow blobs + glitter dust + falling confetti, purely decorative -->
<div class="bg-texture" aria-hidden="true"></div>
<div class="glitter-dust" aria-hidden="true">
  <span class="glit g1">&#10022;</span>
  <span class="glit g2">&#10022;</span>
  <span class="glit g3">&#10022;</span>
  <span class="glit g4">&#10022;</span>
  <span class="glit g5">&#10022;</span>
  <span class="glit g6">&#10022;</span>
  <span class="glit g7">&#10022;</span>
  <span class="glit g8">&#10022;</span>
</div>
<div class="confetti-fall" aria-hidden="true">
  <span class="confetti c1"></span>
  <span class="confetti c2"></span>
  <span class="confetti c3"></span>
  <span class="confetti c4"></span>
  <span class="confetti c5"></span>
  <span class="confetti c6"></span>
  <span class="confetti c7"></span>
  <span class="confetti c8"></span>
  <span class="confetti c9"></span>
  <span class="confetti c10"></span>
</div>

<!-- balloons + stars, gently bobbing in the corners, purely decorative -->
<div class="party-props" aria-hidden="true">
  <svg class="sticker sticker-1" viewBox="0 0 60 100" aria-hidden="true">
    <ellipse cx="30" cy="34" rx="26" ry="32" class="balloon-fill-pink"/>
    <ellipse cx="21" cy="20" rx="6" ry="10" class="balloon-shine"/>
    <polygon points="24,64 36,64 30,74" class="balloon-fill-pink-dark"/>
    <path d="M30 74 Q25 84 30 92" class="balloon-string"/>
  </svg>
  <svg class="sticker-star sticker-2" viewBox="0 0 40 40" aria-hidden="true">
    <polygon points="20,2 25,15 39,15 27,24 32,38 20,29 8,38 13,24 1,15 15,15" class="sticker-star-fill"/>
  </svg>
  <svg class="sticker sticker-3" viewBox="0 0 60 100" aria-hidden="true">
    <ellipse cx="30" cy="34" rx="26" ry="32" class="balloon-fill-purple"/>
    <ellipse cx="21" cy="20" rx="6" ry="10" class="balloon-shine"/>
    <polygon points="24,64 36,64 30,74" class="balloon-fill-purple-dark"/>
    <path d="M30 74 Q35 84 30 92" class="balloon-string"/>
  </svg>
  <svg class="sticker-star sticker-4" viewBox="0 0 40 40" aria-hidden="true">
    <polygon points="20,2 25,15 39,15 27,24 32,38 20,29 8,38 13,24 1,15 15,15" class="sticker-star-fill"/>
  </svg>
</div>

<!-- persistent corner tag, visible on every screen -->
<div class="site-tag" aria-hidden="true">&#127874; The Big Day</div>

<!-- shared tease speech-bubble, positioned near whatever box is hovered -->
<div id="tease-bubble" class="tease-bubble" aria-hidden="true"></div>

<main id="app">

  <!-- ============================================================ -->
  <!-- SCREEN: LANDING + BOXES (the opening view) -->
  <!-- ============================================================ -->
  <section id="screen-boxes" class="screen active">

    <div class="hero-grid">
      <div class="hero-left">
        <div class="ticket-eyebrow">&#10024; A Little Surprise For You</div>
        <h1 class="landing-greeting" id="landing-greeting-1"></h1>
        <p class="landing-briefing" id="landing-briefing"></p>
      </div>
      <div class="hero-right" aria-hidden="true">
        <div class="medallion">
          <span class="medallion-emoji">&#127874;</span>
          <span class="medallion-note">for you</span>
        </div>
      </div>
    </div>

    <h2 class="section-title"><span>Unwrap Your Gifts</span></h2>
    <p class="section-sub" id="boxes-subtitle"></p>

    <div class="box-grid">
      <button class="box-card box-card-1" data-box="1" aria-label="Unwrap the present">
        <span class="box-check" aria-hidden="true">&#10003;</span>
        <div class="ticket-top">
          <span class="ticket-index">No. 01</span>
          <span class="box-icon-badge">
            <svg class="box-icon" viewBox="0 0 48 48" role="img" aria-hidden="true">
              <rect x="8" y="18" width="32" height="24" class="icon-stroke"/>
              <rect x="8" y="10" width="32" height="10" class="icon-stroke"/>
              <rect x="21" y="10" width="6" height="32" class="icon-stroke-fill"/>
              <path d="M18 10 Q18 2 24 4 Q30 2 30 10" class="icon-stroke-line"/>
            </svg>
          </span>
        </div>
        <div class="ticket-divider" aria-hidden="true"></div>
        <div class="ticket-bottom">
          <span class="box-label">The Present</span>
          <span class="box-desc">Click fast. It won't unwrap itself.</span>
        </div>
        <span class="sparkle sparkle-a">&#10022;</span>
        <span class="sparkle sparkle-b">&#10022;</span>
      </button>

      <button class="box-card box-card-2" data-box="2" aria-label="Open the pop-up box">
        <span class="box-check" aria-hidden="true">&#10003;</span>
        <div class="ticket-top">
          <span class="ticket-index">No. 02</span>
          <span class="box-icon-badge">
            <svg class="box-icon" viewBox="0 0 48 48" role="img" aria-hidden="true">
              <rect x="8" y="20" width="32" height="22" class="icon-stroke"/>
              <path d="M14 20 L14 8 M20 20 L20 4 M26 20 L26 6 M32 20 L32 10" class="icon-stroke-line"/>
              <circle cx="41" cy="30" r="5" class="icon-stroke"/>
            </svg>
          </span>
        </div>
        <div class="ticket-divider" aria-hidden="true"></div>
        <div class="ticket-bottom">
          <span class="box-label">The Pop-Up Box</span>
          <span class="box-desc">Turn the crank. You'll regret it.</span>
        </div>
        <span class="sparkle sparkle-a">&#10022;</span>
        <span class="sparkle sparkle-b">&#10022;</span>
      </button>

      <button class="box-card box-card-3" data-box="3" aria-label="Open the diary">
        <span class="box-check" aria-hidden="true">&#10003;</span>
        <div class="ticket-top">
          <span class="ticket-index">No. 03</span>
          <span class="box-icon-badge">
            <svg class="box-icon" viewBox="0 0 48 48" role="img" aria-hidden="true">
              <path d="M24 14 C20 10.5 12 10.5 7 12.5 V36.5 C12 34.5 20 34.5 24 38 C28 34.5 36 34.5 41 36.5 V12.5 C36 10.5 28 10.5 24 14 Z" class="icon-stroke"/>
              <line x1="24" y1="14" x2="24" y2="38" class="icon-stroke-line"/>
            </svg>
          </span>
        </div>
        <div class="ticket-divider" aria-hidden="true"></div>
        <div class="ticket-bottom">
          <span class="box-label">The Diary</span>
          <span class="box-desc">Two pages at a time. Tap to open.</span>
        </div>
        <span class="sparkle sparkle-a">&#10022;</span>
        <span class="sparkle sparkle-b">&#10022;</span>
      </button>
    </div>

    <button id="finale-banner" class="finale-banner hidden">
      &#127882; Every gift is open — tap for the finale
    </button>
  </section>

  <!-- ============================================================ -->
  <!-- SCREEN: BOX 1 — THE PRESENT -->
  <!-- ============================================================ -->
  <section id="screen-box1" class="screen">
    <button class="btn-back" data-back>&larr; back to the gifts</button>

    <div id="box1-game" class="box-stage">
      <h2 class="section-title small"><span id="box1-title"></span></h2>
      <p class="section-sub" id="box1-instructions"></p>

      <button id="chest-target" class="chest-target" aria-label="Click to unwrap the present">
        <svg class="chest-svg" viewBox="0 0 240 200" role="img" aria-hidden="true">
          <ellipse cx="120" cy="180" rx="80" ry="8" class="chest-shadow"/>

          <!-- box body -->
          <rect x="46" y="98" width="148" height="78" rx="16" class="chest-wood"/>
          <rect x="105" y="98" width="30" height="78" class="chest-metal"/>
          <circle cx="120" cy="140" r="9" class="chest-gem"/>

          <!-- lid + bow, hinges open from where it sits on the box -->
          <g id="chest-lid">
            <rect x="40" y="76" width="160" height="26" rx="11" class="chest-wood-dark"/>
            <rect x="105" y="76" width="30" height="26" class="chest-metal"/>
            <ellipse cx="98" cy="68" rx="19" ry="13" class="chest-metal" transform="rotate(-24 98 68)"/>
            <ellipse cx="142" cy="68" rx="19" ry="13" class="chest-metal" transform="rotate(24 142 68)"/>
            <circle cx="120" cy="72" r="11" class="chest-metal-dark"/>
          </g>
        </svg>
      </button>

      <p id="box1-progress-percent" class="progress-percent">0%</p>
      <div class="progress-track" aria-hidden="true">
        <div id="box1-progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- shown full-size on the page itself, not inside the card, once the
         present is unwrapped — first the joke photo, then it swaps to the
         real one after the popup below -->
    <div id="box1-reveal" class="box-reveal hidden">
      <img id="box1-reveal-image" class="reveal-image-big" src="assets/images/lizardGift.jpg" alt="" />
      <button id="box1-home-btn" class="btn-continue hidden" data-back>Back to the gifts</button>
    </div>

    <div id="box1-swap-popup" class="swap-popup hidden">
      <p id="box1-swap-text"></p>
    </div>

    <div id="box1-flash" class="white-flash" aria-hidden="true"></div>
  </section>

  <!-- ============================================================ -->
  <!-- SCREEN: BOX 2 — THE POP-UP BOX -->
  <!-- ============================================================ -->
  <section id="screen-box2" class="screen">
    <button class="btn-back" data-back>&larr; back to the gifts</button>

    <div id="box2-game" class="box-stage">
      <h2 class="section-title small"><span id="box2-title"></span></h2>
      <p class="section-sub" id="box2-instructions"></p>

      <div id="crank-target" class="crank-target" aria-hidden="true">
        <svg class="joker-svg" viewBox="0 0 240 200" role="img" aria-hidden="true">
          <ellipse cx="115" cy="182" rx="78" ry="8" class="chest-shadow"/>

          <!-- box body, ribbon strap + bow to match the present box's style -->
          <rect x="40" y="112" width="150" height="70" rx="14" class="joker-box"/>
          <rect x="98" y="112" width="26" height="70" class="chest-metal"/>
          <rect id="joker-lid" x="34" y="90" width="162" height="26" rx="11" class="joker-box-dark"/>
          <rect x="98" y="90" width="26" height="26" class="chest-metal"/>
          <circle cx="111" cy="103" r="9" class="chest-metal-dark"/>

          <!-- crank: a mounted gear plate with a handle that spins in place -->
          <circle cx="207" cy="150" r="17" class="crank-plate"/>
          <circle cx="207" cy="150" r="17" class="crank-plate-ring"/>
          <g id="crank-handle" class="crank-handle">
            <rect x="204" y="120" width="6" height="30" rx="3" class="chest-metal"/>
            <circle cx="207" cy="118" r="10" class="chest-metal-dark"/>
            <circle cx="207" cy="118" r="4" class="chest-gem"/>
          </g>
        </svg>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="box2-progress-fill" class="progress-fill"></div>
      </div>
      <audio id="box2-audio" preload="none"></audio>
      <audio id="box2-wind-audio" preload="none" loop></audio>
    </div>

    <div id="box2-reveal" class="box-reveal hidden">
      <p id="box2-caption" class="reveal-caption"></p>
      <button class="btn-continue" data-back>Back to the gifts</button>
    </div>

    <!-- plays right here on this same screen, at a modest size — no
         controls, can't be skipped or paused, only goes away once it ends -->
    <div id="box2-video-wrap" class="mini-video-wrap hidden">
      <video id="box2-video" class="mini-video" playsinline oncontextmenu="return false"></video>
      <p class="tap-hint">&#9654; tap to play</p>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- SCREEN: BOX 3 — THE DIARY -->
  <!-- ============================================================ -->
  <section id="screen-box3" class="screen">
    <button class="btn-back" data-back>&larr; back to the gifts</button>

    <div id="box3-game" class="box-stage">
      <h2 class="section-title small"><span id="box3-title"></span></h2>
      <p class="section-sub" id="box3-instructions"></p>

      <div class="diary-scene">
        <button id="diary-cover" class="diary-cover" aria-label="Open the diary">
          <span class="diary-cover-ribbon" aria-hidden="true"></span>
          <span class="diary-cover-title">A Little<br/>Memories Freshup</span>
          <span class="diary-cover-hint">tap to open</span>
        </button>

        <div id="diary-book" class="diary-book hidden">
          <button id="diary-prev" class="diary-arrow diary-arrow-prev is-disabled" aria-label="Previous page">&#10094;</button>

          <div class="diary-spread" id="diary-spread">
            <div class="diary-page diary-page-left" id="diary-page-left"></div>
            <div class="diary-spine" id="diary-spine" aria-hidden="true"></div>
            <div class="diary-page diary-page-right" id="diary-page-right"></div>

            <!-- flipping leaves: one for forward flips (hinges on the
                 left/spine edge), one for backward flips (hinges on the
                 right/spine edge) — positioned exactly over the page slot
                 they're leaving, so the flip reads as continuous -->
            <div id="diary-leaf-fwd" class="diary-leaf diary-leaf-fwd" aria-hidden="true">
              <div class="diary-leaf-face leaf-front" id="leaf-fwd-front"></div>
              <div class="diary-leaf-face leaf-back" id="leaf-fwd-back"></div>
            </div>
            <div id="diary-leaf-rev" class="diary-leaf diary-leaf-rev" aria-hidden="true">
              <div class="diary-leaf-face leaf-front" id="leaf-rev-front"></div>
              <div class="diary-leaf-face leaf-back" id="leaf-rev-back"></div>
            </div>
          </div>

          <button id="diary-next" class="diary-arrow diary-arrow-next" aria-label="Next page">&#10095;</button>
        </div>
      </div>
    </div>

    <div id="box3-reveal" class="box-reveal hidden">
      <button class="btn-continue" data-back>Back to the gifts</button>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- SCREEN: FINALE -->
  <!-- ============================================================ -->
  <section id="screen-finale" class="screen">
    <button id="letter-locked" class="letter-locked" aria-label="Tap to open the letter">
      <div class="envelope" aria-hidden="true">
        <div class="envelope-body"></div>
        <div class="envelope-paper"></div>
        <div id="envelope-flap" class="envelope-flap">
          <span class="envelope-seal">&#128140;</span>
        </div>
      </div>
      <span class="letter-locked-label">A Letter For You</span>
      <span class="letter-locked-hint">tap to open</span>
    </button>

    <div id="letter-card" class="letter-card hidden">
      <span class="letter-seal" aria-hidden="true">&#128140;</span>
      <p class="letter-eyebrow" id="finale-eyebrow"></p>
      <p class="letter-greeting" id="finale-greeting"></p>
      <p class="letter-body" id="finale-letter"></p>
      <p class="letter-signature" id="finale-signature"></p>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
<script src="js/content.js"></script>
<script src="js/utils.js"></script>
<script src="js/box1-chest.js"></script>
<script src="js/box2-jokerbox.js"></script>
<script src="js/box3-diary.js"></script>
<script src="js/finale.js"></script>
<script src="js/main.js"></script>
</body>
</html>
